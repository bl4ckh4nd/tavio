name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a password room
        2. Join as a guest
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tavio version or commit
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 140 on Windows 11
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Convex Cloud + LiveKit Cloud
        - Self-hosted Convex and/or LiveKit
        - Docker trial (docker-compose.yml)
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console, `npx convex logs`, or screenshots. Remove secrets and personal data first.
