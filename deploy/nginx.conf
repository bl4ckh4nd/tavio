server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep in step with public/_headers, which does the same on Cloudflare; security-headers.test.ts compares them.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: https: http://localhost:* http://127.0.0.1:*; font-src 'self' data:; connect-src 'self' data: blob: https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

  location = /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"ok":true}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
