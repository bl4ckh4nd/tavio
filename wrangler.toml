name = "tavio"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = "worker/index.ts"

# Serve the Vite build output as static assets
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
# Assets would otherwise answer before the HTTPS redirect in worker/index.ts.
run_worker_first = true

# Non-secret build-time vars (VITE_* are baked in at build time, these are for reference/CI)
[vars]
VITE_BASE_URL = "https://tavio.mnemonicc.com"

[[routes]]
pattern = "tavio.mnemonicc.com"
custom_domain = true
